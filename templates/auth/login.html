{% extends "base.html" %}

{% block title %}Login - ToolHub Account{% endblock %}

{% block content %}
<div class="container py-5 max-width-450 mx-auto" style="max-width: 450px;">
  <div class="card border radius-lg p-4 shadow-sm">
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-2"><i class="fa-solid fa-wrench"></i></div>
      <h3 class="fw-bold">Welcome Back</h3>
      <p class="text-secondary small">Sign in to access persistent bookmarked tools.</p>
    </div>

    <form action="{{ url_for('auth.login') }}" method="POST">
      <div class="mb-3">
        <label class="form-label fw-bold">Username or Email</label>
        <input type="text" name="login_id" class="form-control" required placeholder="username or email">
      </div>

      <div class="mb-4">
        <label class="form-label fw-bold">Password</label>
        <input type="password" name="password" class="form-control" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary-custom w-100 py-2 font-weight-bold mb-3">Sign In</button>

      <div class="text-center text-muted small">
        Don't have an account? <a href="{{ url_for('auth.register') }}" class="fw-bold">Create one free</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
