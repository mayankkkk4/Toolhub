{% extends "base.html" %}

{% block title %}Register - Create ToolHub Account{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 480px;">
  <div class="card border radius-lg p-4 shadow-sm">
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-2"><i class="fa-solid fa-user-plus"></i></div>
      <h3 class="fw-bold">Create Free Account</h3>
      <p class="text-secondary small">Save favorites across devices with zero tracking.</p>
    </div>

    <form action="{{ url_for('auth.register') }}" method="POST">
      <div class="mb-3">
        <label class="form-label fw-bold">Username</label>
        <input type="text" name="username" class="form-control" required placeholder="devuser">
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Email Address</label>
        <input type="email" name="email" class="form-control" required placeholder="user@example.com">
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Password</label>
        <input type="password" name="password" class="form-control" required placeholder="••••••••">
      </div>

      <div class="mb-4">
        <label class="form-label fw-bold">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary-custom w-100 py-2 font-weight-bold mb-3">Create Account</button>

      <div class="text-center text-muted small">
        Already registered? <a href="{{ url_for('auth.login') }}" class="fw-bold">Sign In</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
