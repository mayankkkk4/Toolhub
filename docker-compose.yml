version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=toolhub-production-secret-key-change-me
      - DATABASE_URL=sqlite:///toolhub.db
      - PORT=5000
    volumes:
      - toolhub-data:/app/data

volumes:
  toolhub-data:
